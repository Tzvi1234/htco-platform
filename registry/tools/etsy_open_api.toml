# Etsy Open API v3 tools (ADR-0014, ADR-0022). DRAFT: none is production-ready yet.
# One tool per read area and per write action; the endpoint map is in
# docs/architecture/etsy-api-capabilities.md. Every write runs only through the Action Gateway
# (ADR-0019): approval, outbox, re-read verification, audit; and only after the owner's first
# trigger of that write on that shop. Never called against a live shop from tests.

[[tools]]
name = "etsy.shop.read"
version = 1
family = "commerce_catalog"
owner = "iris"
side_effect = "none"
risk = "low"
data_scope = "internal"
audit_required = false
readiness = "draft"
description = "Read the shop, its owner's shops and featured listings (getShop, getShopByOwnerUserId, getFeaturedListingsByShop). Endpoints: getShop, getShopByOwnerUserId, getFeaturedListingsByShop. Approval policy R0."

