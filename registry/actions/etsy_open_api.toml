# Execution contracts of Etsy Open API tools (slice 5.12, ADR-0019, ADR-0022): the approval
# policy (equal to the tool's description), verification, channel bindings in order of preference,
# limits keys and the JSON Schemas in packages/contracts/actions/. Reviewed data like the tools.
# Writes stay off until their write flag is named (HTCO_ETSY_WRITE_ACTIONS), checked again when the
# write runs. All four are W3: the tracking upload and vacation mode (slices 6.6, 6.8, 7.12),
# marking a receipt shipped (6.8) and a holiday preference (6.9).

[[actions]]
tool = "etsy.shop.read"
approval_policy = "R0"
verify = "schema"
timeout_seconds = 30
input_schema = "etsy.shop.read.input.json"
output_schema = "etsy.shop.read.output.json"
rate_limit_key = "etsy:app"
user_capability = "view_overview"
[[actions.bindings]]
channel = "api"
recipe = "get_shop"
requires_capability = "shop_details"
breaker_key = "etsy:api"

[[actions]]
tool = "etsy.receipts.read"
approval_policy = "R1"
verify = "schema"
timeout_seconds = 60
input_schema = "etsy.receipts.read.input.json"
output_schema = "etsy.receipts.read.output.json"
rate_limit_key = "etsy:app"
user_capability = "view_orders"
[[actions.bindings]]
channel = "api"
recipe = "list_receipts"
requires_capability = "receipts_read"
breaker_key = "etsy:api"

# AUD-06 (#147 part B): the order history form, with the buyer data Order Intake stores. Granted
# to etsy-order-intake only (tools/registry.py RESTRICTED_GRANTS); never to a user or employee.
[[actions]]
tool = "etsy.order_history.read"
approval_policy = "R1"
verify = "schema"
timeout_seconds = 60
input_schema = "etsy.order_history.read.input.json"
output_schema = "etsy.order_history.read.output.json"
rate_limit_key = "etsy:app"
actor_kinds = ["automation"]
[[actions.bindings]]
channel = "api"
recipe = "list_order_history"
requires_capability = "receipts_read"
breaker_key = "etsy:api"

# AUD-06 (#147 part B): the shipments' tracking codes, no buyer data. Granted to tracking-sync
# only (tools/registry.py RESTRICTED_GRANTS); never to a user or employee.
[[actions]]
tool = "etsy.shipments.read"
approval_policy = "R1"
verify = "schema"
timeout_seconds = 60
input_schema = "etsy.shipments.read.input.json"
output_schema = "etsy.shipments.read.output.json"
rate_limit_key = "etsy:app"
actor_kinds = ["automation"]
[[actions.bindings]]
channel = "api"
recipe = "list_shipments"
requires_capability = "receipts_read"
breaker_key = "etsy:api"

[[actions]]
tool = "etsy.reviews.read"
approval_policy = "R0"
verify = "schema"
timeout_seconds = 30
input_schema = "etsy.reviews.read.input.json"
output_schema = "etsy.reviews.read.output.json"
rate_limit_key = "etsy:app"
user_capability = "view_overview"
[[actions.bindings]]
channel = "api"
recipe = "list_reviews"
breaker_key = "etsy:api"

[[actions]]
tool = "etsy.inventory.update"
approval_policy = "W2"
verify = "reread"
timeout_seconds = 120
input_schema = "etsy.inventory.update.input.json"
output_schema = "etsy.inventory.update.output.json"
rate_limit_key = "etsy:app"
concurrency_key = "shop:{shop_id}:writes"
user_capability = "edit_product_facts"
[[actions.bindings]]
channel = "api"
recipe = "update_listing_inventory"
breaker_key = "etsy:api"
disabled = true  # no recipe yet (#147): never routed until the API channel implements it

# The tracking upload (slices 6.6 and 6.8), W3 (the owner's policy of 2026-10-26): the Owner's own
# press runs after a step-up; an agent's or an automation's request waits for the Owner's approval,
# each time. The channel re-reads the receipt and sends nothing when the code is there.
[[actions]]
tool = "etsy.shipments.create"
approval_policy = "W3"
verify = "reread"
timeout_seconds = 60
input_schema = "etsy.shipments.create.input.json"
output_schema = "etsy.shipments.create.output.json"
rate_limit_key = "etsy:app"
concurrency_key = "shop:{shop_id}:writes"
user_capability = "confirm_shipment_write"
# Never an advisor or the platform; only the Owner's own press runs without an approval.
actor_kinds = ["user", "employee", "automation"]
[[actions.bindings]]
channel = "api"
recipe = "create_receipt_shipment"
requires_scope = "transactions_w"
breaker_key = "etsy:api"

# Vacation mode (7.12, pulled forward by the owner): the only field of updateShop sent for now.
[[actions]]
tool = "etsy.shop.update"
approval_policy = "W3"
verify = "reread"
timeout_seconds = 60
input_schema = "etsy.shop.update.input.json"
output_schema = "etsy.shop.update.output.json"
rate_limit_key = "etsy:app"
concurrency_key = "shop:{shop_id}:writes"
user_capability = "update_shop_settings"
# Never an advisor or the platform; only the Owner's own press runs without an approval.
actor_kinds = ["user", "employee", "automation"]
[[actions.bindings]]
channel = "api"
recipe = "update_shop_vacation"
requires_scope = "shops_w"
breaker_key = "etsy:api"

# Mark a receipt shipped (6.8), where the tracking upload is blocked for the key (A-04): W3 like the
# upload. The channel re-reads the receipt and sends nothing when it is shipped already.
[[actions]]
tool = "etsy.receipts.update"
approval_policy = "W3"
verify = "reread"
timeout_seconds = 60
input_schema = "etsy.receipts.update.input.json"
output_schema = "etsy.receipts.update.output.json"
rate_limit_key = "etsy:app"
concurrency_key = "shop:{shop_id}:writes"
user_capability = "confirm_shipment_write"
# Never an advisor or the platform; only the Owner's own press runs without an approval.
actor_kinds = ["user", "employee", "automation"]
[[actions.bindings]]
channel = "api"
recipe = "update_receipt_status"
requires_scope = "transactions_w"
breaker_key = "etsy:api"

# The holiday calendar (6.9): whether the shop works on one holiday. W3 while it is owner-trigger
# first (the owner's policy for every Etsy write of 2026-10-26); the channel re-reads first.
[[actions]]
tool = "etsy.holiday_preferences.update"
approval_policy = "W3"
verify = "reread"
timeout_seconds = 60
input_schema = "etsy.holiday_preferences.update.input.json"
output_schema = "etsy.holiday_preferences.update.output.json"
rate_limit_key = "etsy:app"
concurrency_key = "shop:{shop_id}:writes"
user_capability = "update_shop_settings"
# Never an advisor or the platform; only the Owner's own press runs without an approval.
actor_kinds = ["user", "employee", "automation"]
[[actions.bindings]]
channel = "api"
recipe = "update_holiday_preference"
requires_scope = "shops_w"
breaker_key = "etsy:api"

# The holiday calendar's read (6.9): the console's before and after of a holiday preference.
[[actions]]
tool = "etsy.policies.read"
approval_policy = "R0"
verify = "schema"
timeout_seconds = 30
input_schema = "etsy.policies.read.input.json"
output_schema = "etsy.policies.read.output.json"
rate_limit_key = "etsy:app"
user_capability = "view_overview"
[[actions.bindings]]
channel = "api"
recipe = "list_holiday_preferences"
breaker_key = "etsy:api"

# The app-wide Etsy budget (slice 5.15): one key's calls per second and per UTC day, shared by
# every shop and worker. Conservative placeholders below Etsy's documented defaults until the
# owner copies the real figures from the Developer Portal (the 5.15 owner question).
[[rate_limits]]
key = "etsy:app"
per_second = 5
per_day = 5000
