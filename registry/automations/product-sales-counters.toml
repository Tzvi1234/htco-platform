# Product Sales Counters. Automation specification (ADR-0013). All sections defined
# (slice 5.11); readiness stays "draft" until the owner approves the activation.
id = "product-sales-counters"
name = "Product Sales Counters"
version = 1
business_owner = "roni"
primary_trigger = "event"
callable_from = ["event", "workflow", "user_action"]
# The rebuild, by an owner or admin (POST /v1/automations/product-sales-counters/executions).
user_capability = "request_bulk_resync"
timeout_seconds = 120
side_effect = "internal"
approval_required = false
ai_steps = []
readiness = "draft"
activation_phase = 5

[retry]
max_attempts = 5
initial_backoff_seconds = 5
max_backoff_seconds = 900

[specification.identity]
status = "defined"
text = "Product Sales Counters (product-sales-counters), version 1. Deterministic: no model calls, no browser, no Etsy call."

[specification.business_owner]
status = "defined"
text = "roni: accountable for the outcome (the owner until Roni is active in Phase 13); Engineering maintains the code."

[specification.trigger]
status = "defined"
text = "Primary: event: orders.ingested.v1, orders.updated.v1, orders.cancelled.v1 and orders.refunded.v1 (key counters:{shop_id}:{receipt_id}:{event_type}:{etsy_updated_at}). Also workflow, through the engine's authorization; and user_action for the rebuild ({\"rebuild\": true} for a shop), by an owner or admin (request_bulk_resync)."

[specification.input_schema]
status = "defined"
text = "packages/contracts/automations/product-sales-counters.input.json: the receipt_id and the event_type, or {\"rebuild\": true} for the shop. No buyer data."

[specification.preconditions]
status = "defined"
text = "The order is stored (otherwise the run completes as skipped: not_stored)."

[specification.steps]
status = "defined"
text = "In one transaction: read the stored order's state and items, and what the receipt counted before; compute what it should count now (its units per listing when the state counts as a sale, nothing when unpaid, cancelled or refunded); move app.product_sales_counters by the difference; keep the new counts in app.product_sales_applications. The rebuild does this for every stored receipt of the shop, in pages of 200 by receipt ID, each receipt in its own transaction: the receipts the history backfill stored (it publishes no events) and those whose events came while the automation was not active."

[specification.output_schema]
status = "defined"
text = "packages/contracts/automations/product-sales-counters.output.json: the receipt_id and the units and orders moved per listing; for a rebuild, the receipts recounted (rebuilt) and how many moved."

[specification.dependencies]
status = "defined"
text = "The order history store and the two counter tables; no external system."

[specification.error_handling]
status = "defined"
text = "A database error rolls the transaction back and raises into the retry policy; counters never go negative: a move below zero (only drift or a bug, given the ledger) keeps zero under the check constraint and logs product_sales.clamped with the shop, listing and numbers."

[specification.retry_policy]
status = "defined"
text = "Five attempts, exponential backoff from 5 s to 15 min with jitter; then dead-lettered, recoverable by an audited admin retry."

[specification.idempotency]
status = "defined"
text = "The engine's unique key per event and version; and the move is by difference, so a replayed event moves nothing and a cancellation takes the units back once (AC-5.11.5). The rebuild goes through the same ledger: running it again, or after the events, moves nothing, and a retry after a timeout resumes safely."

[specification.timeouts_and_sla]
status = "defined"
text = "120 s per attempt; within a minute of the event at p95."

[specification.permissions]
status = "defined"
text = "Runs as the htco_worker role inside its job's organization; reads the stored order's state and items; writes only the two counter tables. No action."

[specification.audit]
status = "defined"
text = "Execution state changes with actor and correlation ID; each application row records the execution that wrote it."

[specification.tests]
status = "defined"
text = "tests/application/test_order_automations.py (property tests over any sequence and replay, AC-5.11.5); tests/integration/test_order_scenarios.py (Scenario G units, a replayed cancellation)."

[specification.recovery]
status = "defined"
text = "Runbook: docs/features/orders-ingest/operations.md (Product Sales Counters). Counters are rebuilt from the stored orders by the rebuild ({\"rebuild\": true} for a shop); activation checklist step 2b."

[specification.approvals]
status = "defined"
text = "None: internal counters only."

[specification.metrics]
status = "defined"
text = "Admin › Health: executions, success rate, retries, dead letters and latency."
