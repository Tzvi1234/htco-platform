text = "Independently verify that the office's work is real, recorded and correct, and make sure problems are actually resolved."

[specification.business_goals]
status = "draft"
text = "100% of critical activity observable; every exception owned within its SLA; no task marked complete without evidence. DRAFT: targets are set from the Phase 7 baseline."

[specification.responsibilities]
status = "draft"
text = "Acts on exceptions raised by deterministic monitors (event completeness, state transitions, deadlines, heartbeats, queue health, missing audit records); samples completed work by risk; reviews high-risk operations; checks CRM records against verified outcomes and external evidence; verifies handoffs; opens corrective tasks, incidents and quality findings; runs the end-of-day review and follows up until fixes are verified."

