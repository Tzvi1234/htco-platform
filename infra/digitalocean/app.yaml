# DigitalOcean App Platform spec for the HTCO API (slice 1.5 part 2).
#
# Deployed only by the owner-started `.github/workflows/deploy.yml`, which fills every ${…} from
# GitHub secrets and variables at deploy time: no secret value is committed (AC-1.5.4).
# Cost: two fixed-size instances, $5 per month each (the API and, from slice 5.1, the agent-worker),
# that cannot scale (neither automatically nor by hand), so the bill cannot grow by itself; the web
# app's static site adds nothing. Frankfurt, next to the Supabase project.
name: htco
region: fra
# DNS: Cloudflare `api` and `dash` CNAME htco-s4o93.ondigitalocean.app, DNS only (not proxied), so
# App Platform issues and renews the certificates itself and the API sees the visitor's address.
domains:
  - domain: api.ht-co.app
    type: PRIMARY
  # The web app (slice 3.8).
  - domain: dash.ht-co.app
    type: ALIAS
# dash.ht-co.app/api goes to the API with the prefix removed, so the web app calls the API on its own
# origin (ADR-0006: no CORS, first-party cookie); the rest of dash.ht-co.app is the web app.
# Every other host (api.ht-co.app, the platform URL) is the API.
ingress:
  rules:
    - match:
        authority:
          exact: dash.ht-co.app
        path:
          prefix: /api
      component:
        name: api
    - match:
        authority:
          exact: dash.ht-co.app
        path:
          prefix: /
      component:
        name: web
    - match:
        path:
          prefix: /
      component:
        name: api
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: api
    image:
      registry_type: GHCR
      registry: tzvi1234
      repository: htco-api
      tag: ${IMAGE_TAG}
      registry_credentials: ${GHCR_PULL_CREDENTIALS}
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
    envs:
      - key: HTCO_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: HTCO_RELEASE
        scope: RUN_TIME
        value: ${IMAGE_TAG}
      - key: HTCO_SUPABASE_URL
        scope: RUN_TIME
        value: ${HTCO_SUPABASE_URL}
      # Supabase's session pooler (IPv4, free). The password is not in the URL: libpq reads it
      # from PGPASSWORD, so it never needs URL encoding and never appears in a connection string.
      - key: HTCO_DATABASE_URL
        scope: RUN_TIME
        value: postgresql://postgres.${SUPABASE_PROJECT_REF}@${SUPABASE_POOLER_HOST}:5432/postgres?sslmode=require
      - key: PGPASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${PGPASSWORD}
      - key: HTCO_SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SENTRY_DSN}
      - key: HTCO_SUPABASE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SUPABASE_SECRET_KEY}
      # Invitation links land on the web app's accept page, which posts the link's tokens and the
      # new password to /v1/auth/invitations/accept. Must be in Supabase's redirect allow-list.
      - key: HTCO_INVITE_REDIRECT_URL
        scope: RUN_TIME
        value: https://dash.ht-co.app/accept-invite
      # Emailed password reset links land on the web app's reset page, which posts the link's tokens
      # and the new password to /v1/auth/password/reset. Must be in Supabase's redirect allow-list.
      - key: HTCO_PASSWORD_RESET_REDIRECT_URL
        scope: RUN_TIME
        value: https://dash.ht-co.app/reset-password
      # Web sign-in (slice 3.5): off until the session key secret exists (blank means unset).
      - key: HTCO_SESSION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SESSION_KEY}
      - key: HTCO_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: ${HTCO_SUPABASE_PUBLISHABLE_KEY}
      - key: HTCO_WEB_ORIGINS
        scope: RUN_TIME
        value: ${HTCO_WEB_ORIGINS}
      # Passkeys as a second factor (issue #113): OFF until the owner enables Supabase's WebAuthn
      # MFA add-on and sets its RP config (RP ID ht-co.app, origin https://dash.ht-co.app). See
      # docs/features/identity-access/passkeys.md. Turning it on is the owner's change only.
      - key: HTCO_PASSKEYS_ENABLED
        scope: RUN_TIME
        value: "false"
      # Etsy token vault (slice 4.2): off until the key secret exists (blank means unset). The
      # previous keys stay blank except while rotating to a new key.
      - key: HTCO_TOKEN_VAULT_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_TOKEN_VAULT_KEY}
      - key: HTCO_TOKEN_VAULT_PREVIOUS_KEYS
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_TOKEN_VAULT_PREVIOUS_KEYS}
      # Etsy app credentials (slices 4.1 and 4.3), from the GitHub secrets ETSY_KEYSTRING and
      # ETSY_SHARED_SECRET. The redirect URI is the web app's callback route, registered exactly
      # in the Etsy app. Connecting stays off (503 etsy-unavailable) until the credentials, the
      # vault key and web sign-in are all set; blank secrets mean unset.
      - key: HTCO_ETSY_KEYSTRING
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_ETSY_KEYSTRING}
      - key: HTCO_ETSY_SHARED_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_ETSY_SHARED_SECRET}
      - key: HTCO_ETSY_REDIRECT_URI
        scope: RUN_TIME
        value: https://dash.ht-co.app/integrations/etsy/callback
      # Etsy webhooks (slice 5.3): `POST /webhooks/etsy`, on since the owner registered the endpoint
      # in the Etsy developer portal (activation step 5 of 5.11). The signing secret comes from the
      # GitHub secret ETSY_WEBHOOK_SECRET (docs/features/orders-ingest/operations.md); blank means
      # unset. Rollback: "false" (reconciliation keeps the store complete meanwhile).
      - key: HTCO_ETSY_WEBHOOKS_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: HTCO_ETSY_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_ETSY_WEBHOOK_SECRET}
      # Automations (5.10, 5.11): the API creates executions for the worker (a user's trigger
      # such as the counters rebuild, an audited admin retry); it never runs a handler.
      - key: HTCO_AUTOMATIONS_ENABLED
        scope: RUN_TIME
        value: "true"
      # Slice 5.4: the order history sync ran here only as the fallback. Etsy Order Intake is active
      # (5.11, activation step 3): stale reads, the manual sync and "Re-sync selected" go to the
      # worker's queue. "false" is also the code's default now; kept explicit. Rollback: "true".
      - key: HTCO_ORDER_SYNC_IN_API
        scope: RUN_TIME
        value: "false"
# The agent-worker (slice 5.1, ADR-0007): the API's image running the job queue's worker. It
# connects to the same database and switches to the `htco_worker` role. Its scheduled jobs run only
# when named in HTCO_WORKER_SCHEDULES. A fixed-size instance, $5 per month, that cannot scale.
workers:
  - name: agent-worker
    image:
      registry_type: GHCR
      registry: tzvi1234
      repository: htco-api
      tag: ${IMAGE_TAG}
      registry_credentials: ${GHCR_PULL_CREDENTIALS}
    run_command: python -m htco_worker
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # UNVERIFIED for App Platform workers: the deploy's cost proposal validates the spec first.
    liveness_health_check:
      port: 8081
      http_path: /healthz
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 4
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
    envs:
      - key: HTCO_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: HTCO_RELEASE
        scope: RUN_TIME
        value: ${IMAGE_TAG}
      - key: HTCO_DATABASE_URL
        scope: RUN_TIME
        value: postgresql://postgres.${SUPABASE_PROJECT_REF}@${SUPABASE_POOLER_HOST}:5432/postgres?sslmode=require
      - key: PGPASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${PGPASSWORD}
      # AC-6.7.4: a dead-lettered automation execution is reported to Sentry (blank means off).
      - key: HTCO_SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SENTRY_DSN}
      # The daily maintenance (job-queue operations): read-only Etsy probes, refresh-token expiry
      # checks, the purge of disconnected shops after their date, pruning of finished jobs. And
      # reconciliation (5.5; activation step 4 of 5.11) at HTCO_RECONCILIATION_SCHEDULE's times.
      - key: HTCO_WORKER_SCHEDULES
        scope: RUN_TIME
        value: maintenance.capability_probes,maintenance.refresh_token_expiry,maintenance.purge_disconnected_shops,maintenance.prune_finished_jobs,orders.reconciliation
      # Slice 5.4: Etsy reads of the automations through the real Action Gateway ("reads"); "off"
      # switches back to refusing every action. Writes never run (no approvals in the worker).
      - key: HTCO_WORKER_ACTION_GATEWAY
        scope: RUN_TIME
        value: reads
      - key: HTCO_WORKER_HEALTH_PORT
        scope: RUN_TIME
        value: "8081"
      - key: HTCO_TOKEN_VAULT_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_TOKEN_VAULT_KEY}
      - key: HTCO_TOKEN_VAULT_PREVIOUS_KEYS
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_TOKEN_VAULT_PREVIOUS_KEYS}
      - key: HTCO_ETSY_KEYSTRING
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_ETSY_KEYSTRING}
      - key: HTCO_ETSY_SHARED_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_ETSY_SHARED_SECRET}
# The web app (slice 3.8, client ADR-0006): built by App Platform from htco-clients `main` on every
# push and served as static files; free inside an app that has a paid service (the deploy workflow's
# budget step checks the proposed cost).
static_sites:
  - name: web
    github:
      repo: Tzvi1234/htco-clients
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/web/Dockerfile
    output_dir: /src/apps/web/dist
    catchall_document: index.html
