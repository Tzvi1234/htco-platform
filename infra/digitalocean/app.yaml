# DigitalOcean App Platform spec for the HTCO API (slice 1.5 part 2).
#
# Deployed only by the owner-started `.github/workflows/deploy.yml`, which fills every ${…} from
# GitHub secrets and variables at deploy time: no secret value is committed (AC-1.5.4).
# Cost: one fixed-size instance, $5 per month, that cannot scale (neither automatically nor by
# hand), so the bill cannot grow by itself; the web app's static site adds nothing. Frankfurt, next to the Supabase project.
name: htco
region: fra
# DNS: Cloudflare `api` and `dash` CNAME htco-s4o93.ondigitalocean.app, DNS only (not proxied), so
# App Platform issues and renews the certificates itself and the API sees the visitor's address.
domains:
  - domain: api.ht-co.app
    type: PRIMARY
  # The web app (slice 3.8).
  - domain: dash.ht-co.app
    type: ALIAS
# dash.ht-co.app/api goes to the API with the prefix removed, so the web app calls the API on its own
# origin (ADR-0006: no CORS, first-party cookie); the rest of dash.ht-co.app is the web app.
# Every other host (api.ht-co.app, the platform URL) is the API.
ingress:
  rules:
    - match:
        authority:
          exact: dash.ht-co.app
        path:
          prefix: /api
      component:
        name: api
    - match:
        authority:
          exact: dash.ht-co.app
        path:
          prefix: /
      component:
        name: web
    - match:
        path:
          prefix: /
      component:
        name: api
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: api
    image:
      registry_type: GHCR
      registry: tzvi1234
      repository: htco-api
      tag: ${IMAGE_TAG}
      registry_credentials: ${GHCR_PULL_CREDENTIALS}
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /readyz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    liveness_health_check:
      http_path: /healthz
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: FIVE_MINUTES
    envs:
      - key: HTCO_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: HTCO_RELEASE
        scope: RUN_TIME
        value: ${IMAGE_TAG}
      - key: HTCO_SUPABASE_URL
        scope: RUN_TIME
        value: ${HTCO_SUPABASE_URL}
      # Supabase's session pooler (IPv4, free). The password is not in the URL: libpq reads it
      # from PGPASSWORD, so it never needs URL encoding and never appears in a connection string.
      - key: HTCO_DATABASE_URL
        scope: RUN_TIME
        value: postgresql://postgres.${SUPABASE_PROJECT_REF}@${SUPABASE_POOLER_HOST}:5432/postgres?sslmode=require
      - key: PGPASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${PGPASSWORD}
      - key: HTCO_SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SENTRY_DSN}
      - key: HTCO_SUPABASE_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SUPABASE_SECRET_KEY}
      # Invitation links land on the web app's accept page, which posts the link's tokens and the
      # new password to /v1/auth/invitations/accept. Must be in Supabase's redirect allow-list.
      - key: HTCO_INVITE_REDIRECT_URL
        scope: RUN_TIME
        value: https://dash.ht-co.app/accept-invite
      # Web sign-in (slice 3.5): off until the session key secret exists (blank means unset).
      - key: HTCO_SESSION_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${HTCO_SESSION_KEY}
      - key: HTCO_SUPABASE_PUBLISHABLE_KEY
        scope: RUN_TIME
        value: ${HTCO_SUPABASE_PUBLISHABLE_KEY}
      - key: HTCO_WEB_ORIGINS
        scope: RUN_TIME
        value: ${HTCO_WEB_ORIGINS}
# The web app (slice 3.8, client ADR-0006): built by App Platform from htco-clients `main` on every
# push and served as static files; free inside an app that has a paid service (the deploy workflow's
# budget step checks the proposed cost).
static_sites:
  - name: web
    github:
      repo: Tzvi1234/htco-clients
      branch: main
      deploy_on_push: true
    dockerfile_path: apps/web/Dockerfile
    output_dir: /src/apps/web/dist
    catchall_document: index.html
