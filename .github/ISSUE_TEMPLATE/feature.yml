name: Feature or slice
description: Plan a new feature or a slice of one
labels: ["feature"]
body:
  - type: input
    id: phase
    attributes:
      label: Phase and slice
      placeholder: "Phase 4, slice 4.4"
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the user or system can do when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, one per line, with IDs.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: risk
    attributes:
      label: Security and privacy impact
      options:
        - None
        - Low
        - Needs a threat model (auth, money, PII, webhooks, agents, migrations, external writes)
    validations:
      required: true
