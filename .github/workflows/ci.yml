# Checks for every pull request and every push to main. Branch rules require one status,
# `ci-gate`, which passes only when every job below passed (ER-GIT-04, TESTING_STRATEGY §8).
# Actions are pinned to commit SHAs (checked by tools/check_action_pins.py); jobs get only the
# permissions they need.
name: CI

on:
  pull_request:
    # `edited` re-runs the checks when the title or the "Test changes" section changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: File hygiene hooks
        run: uv run prek run --all-files --show-diff-on-failure --skip gitleaks
      - name: Lint
        run: uv run just lint
      - name: Types
        run: uv run just types
      - name: Architecture contracts
        run: uv run just arch

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: Tests with coverage floors
        run: uv run just test

  # A real Chromium against pages served on 127.0.0.1 only, never a live site (Phase 8A).
  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: Install the Chromium build pinned by the locked Playwright
        run: uv run --package htco-browser-worker playwright install --with-deps chromium
      - name: Real-Chromium tests
        env:
          HTCO_TEST_BROWSER: "1"
          # Ubuntu 24.04 runners restrict unprivileged user namespaces, which the sandbox needs.
          HTCO_TEST_BROWSER_SANDBOX: "0"
        run: uv run pytest -m browser -q tests/browser_worker

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_VERSION: "2.6.0"
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      # A pull request scans the commits it brings (base..the merge commit); a push to main scans
      # main's whole history. `fetch-depth: 0` also fetches every other branch, and a finding on
      # another open PR's branch must not turn every PR red: that branch is scanned by its own PR,
      # and every ref by the daily full-history scan (secrets-history.yml). This job stays
      # required through ci-gate (tests/tools/test_secret_scan.py).
      - name: Secrets in this run's history
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fail closed: an empty base would make the range `..HEAD`, which scans nothing.
            [ -n "$BASE_SHA" ] || { echo "::error::no base SHA for the pull request's range"; exit 1; }
            range="$BASE_SHA..HEAD"
          else
            range="HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range" .
      - name: Install osv-scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Known vulnerabilities in locked dependencies
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile uv.lock'

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_CLI_VERSION: "2.120.0"
      SUPABASE_CLI_SHA256: 7074584113aa00495beeac661c41fb09f1ddd0a483cd7333894b0d080086dc6e
      HTCO_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Supabase CLI
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/supabase.tar.gz"             "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  $RUNNER_TEMP/supabase.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/supabase.tar.gz" --directory "$RUNNER_TEMP" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Start Postgres and apply every migration
        run: supabase db start
      - name: Re-apply every migration and the seed
        run: supabase db reset
      - name: Database tests (pgTAP)
        run: supabase test db
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      # AC-5.10.7: the definitions load from registry/automations/, and the database then matches.
      - name: Automation definitions match the registry
        env:
          HTCO_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          uv run htco registry sync --automations --apply
          uv run htco registry sync --automations --check
      - name: Integration tests against the database
        run: uv run just test-db

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: actionlint, zizmor and SHA pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run just workflows

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: htco-api:ci
      - name: Runs as a non-root user
        run: |
          user="$(docker image inspect htco-api:ci --format '{{.Config.User}}')"
          echo "Image user: ${user:-<none>}"
          case "${user%%:*}" in
            "" | root | 0) echo "::error::The image must run as a non-root user"; exit 1 ;;
          esac
      - name: Refuses to start without its settings
        run: |
          status=0
          docker run --rm htco-api:ci || status=$?
          if [ "$status" -ne 78 ]; then
            echo "::error::Expected exit code 78 (configuration error), got $status"
            exit 1
          fi
      - name: The agent-worker in the same image refuses to start without its settings
        run: |
          status=0
          docker run --rm htco-api:ci python -m htco_worker || status=$?
          if [ "$status" -ne 78 ]; then
            echo "::error::Expected exit code 78 (configuration error) from the worker, got $status"
            exit 1
          fi
      - name: Starts with a read-only file system and answers its health checks
        run: |
          docker run --detach --name api --publish 8080:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --env HTCO_ENVIRONMENT=test htco-api:ci
          # Docker's port proxy resets connections until the app listens, so retry every error.
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: No fixable high or critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: htco-api:ci
          grype-version: v0.120.1
          severity-cutoff: high
          only-fixed: true
          output-format: table

  contract:
    name: contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OASDIFF_VERSION: "1.33.0"
      OASDIFF_SHA256: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/oasdiff.tar.gz" --directory "$RUNNER_TEMP" oasdiff
      - name: No breaking change against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          contract=packages/contracts/openapi.yaml
          if ! git cat-file -e "$BASE_SHA:$contract" 2>/dev/null; then
            echo "::notice::The base branch has no OpenAPI contract yet; nothing to compare."
            exit 0
          fi
          git show "$BASE_SHA:$contract" > "$RUNNER_TEMP/base-openapi.yaml"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.yaml" "$contract" --fail-on ERR

  test-integrity:
    name: test-integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: Weakened tests need a "Test changes" explanation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python -m tools.test_integrity --base "$BASE_SHA"

  migration-order:
    name: migration-order
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      # AC-5.0.1: a new migration sorts after the newest one on main, so `db push` applies it in order.
      - name: New migrations sort after main's newest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python -m tools.migration_order --base "$BASE_SHA"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: true
          cache-python: true
      - name: Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python -m tools.conventional_commit --title "$PR_TITLE"

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [checks, tests, browser, database, security, workflows, image, contract, test-integrity, migration-order, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          # Pull-request-only jobs are skipped on pushes to main; everything else must succeed.
          pull_request_only = {"contract", "test-integrity", "migration-order", "pr-title"}
          on_push = os.environ["EVENT_NAME"] != "pull_request"
          failed = {
              name: job["result"]
              for name, job in needs.items()
              if job["result"] != "success"
              and not (on_push and name in pull_request_only and job["result"] == "skipped")
          }
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if failed else 0)
          PY
