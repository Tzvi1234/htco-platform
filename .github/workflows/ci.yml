# Checks for every pull request and every push to main. Branch rules require one status,
# `ci-gate`, which passes only when every job below passed (ER-GIT-04, TESTING_STRATEGY §8).
# Actions are pinned to commit SHAs (checked by tools/check_action_pins.py); jobs get only the
# permissions they need.
name: CI

on:
  pull_request:
    # `edited` re-runs the checks when the title or the "Test changes" section changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  FORCE_COLOR: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true
      - name: File hygiene hooks
        run: uv run prek run --all-files --show-diff-on-failure --skip gitleaks
      - name: Lint
        run: uv run just lint
      - name: Types
        run: uv run just types
      - name: Architecture contracts
        run: uv run just arch

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true
      - name: Tests with coverage floors
        run: uv run just test

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_VERSION: "2.6.0"
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Secrets in the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .'
      - name: Install osv-scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Known vulnerabilities in locked dependencies
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile uv.lock'

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true
      - name: actionlint, zizmor and SHA pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run just workflows

  test-integrity:
    name: test-integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true
      - name: Weakened tests need a "Test changes" explanation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python -m tools.test_integrity --base "$BASE_SHA"

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-python: true
      - name: Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python -m tools.conventional_commit --title "$PR_TITLE"

  ci-gate:
    name: ci-gate
    if: always()
    needs: [checks, tests, security, workflows, test-integrity, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          # Pull-request-only jobs are skipped on pushes to main; everything else must succeed.
          pull_request_only = {"test-integrity", "pr-title"}
          on_push = os.environ["EVENT_NAME"] != "pull_request"
          failed = {
              name: job["result"]
              for name, job in needs.items()
              if job["result"] != "success"
              and not (on_push and name in pull_request_only and job["result"] == "skipped")
          }
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if failed else 0)
          PY
