# The full-history secret scan: every branch and tag, every day, and on demand. CI's `security`
# job scans only the commits of its own run (a pull request's range, or main), so a finding on one
# branch never fails the others; this scan still sees every ref. A finding fails the run, and
# GitHub notifies whoever last edited the schedule. Known false positives are listed, with a reason
# each, in .gitleaksignore (owned by the owner in CODEOWNERS).
name: Secrets history

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-history
  cancel-in-progress: false

jobs:
  full-history:
    name: full-history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Secrets in every branch and tag
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="--all" .'
