# Deploy the API to DigitalOcean App Platform. Started only by the owner (slice 1.5 part 2); the
# first step stops anyone but the repository owner.
#
# Without `image_tag`: build the image of the chosen commit, check it runs as non-root, scan it,
# push it to GHCR as ghcr.io/tzvi1234/htco-api:<commit SHA>, then deploy it. With `image_tag`:
# deploy that already pushed image again, which is how a rollback is done (AC-1.5.3).
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   variables  SUPABASE_PROJECT_REF, SUPABASE_POOLER_HOST, HTCO_SUPABASE_URL
#   secrets    DIGITALOCEAN_ACCESS_TOKEN (App Platform scopes only), GHCR_PULL_TOKEN (read:packages),
#              SUPABASE_DB_PASSWORD, HTCO_SENTRY_DSN, HTCO_SUPABASE_SECRET_KEY
name: Deploy API

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy again (a rollback); empty builds this commit"
        type: string
        default: ""

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tzvi1234/htco-api
      REQUESTED_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Only the repository owner may run this
        run: |
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Only $GITHUB_REPOSITORY_OWNER may run this workflow (started by $GITHUB_ACTOR)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the image tag
        id: tag
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            case "$REQUESTED_TAG" in
              *[!0-9a-f]*) echo "::error::image_tag must be a commit SHA"; exit 1 ;;
            esac
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.build == 'true'
      - name: Build
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - name: Runs as a non-root user
        if: steps.tag.outputs.build == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          user="$(docker image inspect "$IMAGE:$TAG" --format '{{.Config.User}}')"
          case "${user%%:*}" in
            "" | root | 0) echo "::error::The image must run as a non-root user"; exit 1 ;;
          esac
      - name: No fixable high or critical vulnerabilities
        if: steps.tag.outputs.build == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          grype-version: v0.120.1
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Sign in to GHCR
        if: steps.tag.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: steps.tag.outputs.build == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker push "$IMAGE:$TAG"
      - name: Deploy
        id: deploy
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_PULL_CREDENTIALS: tzvi1234:${{ secrets.GHCR_PULL_TOKEN }}
          HTCO_SUPABASE_URL: ${{ vars.HTCO_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          HTCO_SENTRY_DSN: ${{ secrets.HTCO_SENTRY_DSN }}
          HTCO_SUPABASE_SECRET_KEY: ${{ secrets.HTCO_SUPABASE_SECRET_KEY }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: infra/digitalocean/app.yaml
          print_deploy_logs: true
      - name: The deployed API answers its health checks
        env:
          APP: ${{ steps.deploy.outputs.app }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          url="$(printf '%s' "$APP" | jq -r '.live_url')"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 6 "$url/healthz"
          curl --fail --silent --show-error "$url/readyz"
          {
            echo "## Deployed \`$TAG\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
