# Run `htco admin bootstrap` against production (slice 2.5): create the owner's organization and
# owner membership for a user who already exists in Supabase Auth. Idempotent: running it again
# changes nothing. Started only by the repository owner; the first step stops anyone else.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   variables  SUPABASE_PROJECT_REF, SUPABASE_POOLER_HOST
#   secret     SUPABASE_DB_PASSWORD
name: Admin bootstrap

on:
  workflow_dispatch:
    inputs:
      email:
        description: "The owner's sign-up email"
        type: string
        required: true
      organization:
        description: "The organization's name"
        type: string
        required: true
      display_name:
        description: "The owner's display name"
        type: string
        required: true

permissions: {}

concurrency:
  group: admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Only the repository owner may run this
        run: |
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Only $GITHUB_REPOSITORY_OWNER may run this workflow (started by $GITHUB_ACTOR)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - name: Bootstrap the owner
        env:
          # The session pooler (IPv4); libpq reads the password from PGPASSWORD, never the URL.
          HTCO_DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}@${{ vars.SUPABASE_POOLER_HOST }}:5432/postgres?sslmode=require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          OWNER_EMAIL: ${{ inputs.email }}
          ORGANIZATION: ${{ inputs.organization }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          result="$(uv run --package htco-api htco admin bootstrap \
            --email "$OWNER_EMAIL" --organization "$ORGANIZATION" --display-name "$DISPLAY_NAME")"
          echo "$result"
          {
            echo "## Owner bootstrap"
            echo '```json'
            echo "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
