# Apply database migrations to a Supabase project. Started only by the owner (AC-2.1.4): it never
# runs on push or pull request, and its first step stops anyone but the repository owner (write
# access alone is enough to dispatch a workflow). Every run shows a dry run first; applying needs `apply: true` and
# then records the applied versions in the run summary.
#
# After the migrations it loads the reviewed automation definitions (`htco registry sync
# --automations`, slice 5.10): a dry run always, applied with `apply: true`.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   variable SUPABASE_PROJECT_REF   the project's reference ID
#   variable SUPABASE_POOLER_HOST   the session pooler's host (as for the deploy)
#   secret   SUPABASE_ACCESS_TOKEN  a personal access token of the owner's Supabase account
#   secret   SUPABASE_DB_PASSWORD   the project's database password
name: Migrate database

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the migrations (false = dry run only)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_CLI_VERSION: "2.120.0"
      SUPABASE_CLI_SHA256: 7074584113aa00495beeac661c41fb09f1ddd0a483cd7333894b0d080086dc6e
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Only the repository owner may run this
        run: |
          if [ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error::Only $GITHUB_REPOSITORY_OWNER may run this workflow (started by $GITHUB_ACTOR)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Supabase CLI
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  $RUNNER_TEMP/supabase.tar.gz" | sha256sum --check --strict -
          tar --extract --gzip --file "$RUNNER_TEMP/supabase.tar.gz" --directory "$RUNNER_TEMP" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Dry run (what would be applied)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply the migrations
        if: ${{ inputs.apply }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: ${{ !cancelled() }}
        with:
          version: "0.13.5"
      # Slice 5.10: the reviewed automation definitions of registry/automations/ (dry run first).
      - name: Automation definitions (dry run)
        if: ${{ !cancelled() }}
        # Before the 5.10 migration is applied the table does not exist yet: a dry run reports it.
        continue-on-error: ${{ !inputs.apply }}
        env:
          HTCO_DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}@${{ vars.SUPABASE_POOLER_HOST }}:5432/postgres?sslmode=require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: uv run --package htco-api htco registry sync --automations
      - name: Automation definitions (apply)
        if: ${{ inputs.apply }}
        env:
          HTCO_DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}@${{ vars.SUPABASE_POOLER_HOST }}:5432/postgres?sslmode=require
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: uv run --package htco-api htco registry sync --automations --apply
      - name: Record the applied versions
        # Also after a failed apply: earlier migrations may have been applied before the failure.
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Migrations on project ${PROJECT_REF} (apply: ${APPLY})"
            echo '```'
            supabase migration list --password "$SUPABASE_DB_PASSWORD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
