[project]
name = "htco-api"
version = "0.0.0"
description = "HTCO HTTP API: routes, request and response schemas, and the composition root."
requires-python = "==3.14.*"
dependencies = [
  "fastapi>=0.142,<0.144",
  "htco-application",
  "htco-domain",
  "htco-persistence",
  "htco-platform",
  "uvicorn>=0.54,<0.55",
]

[project.scripts]
htco = "htco_api.cli:entry_point"

[tool.uv.sources]
htco-application = { workspace = true }
htco-domain = { workspace = true }
htco-persistence = { workspace = true }
htco-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
