[project]
name = "htco-agent-runtime"
version = "0.0.0"
description = "HTCO agent runtime: LangGraph graphs, checkpoints and the tool bridge, behind the runtime port."
requires-python = "==3.14.*"
dependencies = [
  "htco-application",
  "langgraph>=1.2,<1.3",
]

[tool.uv.sources]
htco-application = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
