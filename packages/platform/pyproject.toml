[project]
name = "htco-platform"
version = "0.0.0"
description = "HTCO cross-cutting infrastructure: settings, logging, tracing, crypto, clock and IDs."
requires-python = "==3.14.*"
dependencies = [
  "anyio>=4.12,<5",
  "httpx>=0.28,<0.29",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-instrumentation-httpx>=0.66b0,<0.67",
  "opentelemetry-sdk>=1.45,<2",
  "pydantic-settings>=2.15,<3",
  "sentry-sdk>=2.70,<3",
  "structlog>=26.1,<27",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
