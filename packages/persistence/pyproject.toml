[project]
name = "htco-persistence"
version = "0.0.0"
description = "HTCO Postgres adapters: connections, repositories, inbox and outbox, job queue, audit writer."
requires-python = "==3.14.*"
dependencies = [
  "htco-application",
  "htco-platform",
  "psycopg[binary]>=3.3.6,<3.4",
]

[tool.uv.sources]
htco-application = { workspace = true }
htco-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
