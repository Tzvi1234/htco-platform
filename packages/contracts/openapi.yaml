  /v1/relay-items/{item_id}/upload:
    post:
      tags:
      - owner-writes
      summary: Upload a relay item's pasted tracking to its Etsy order (the Owner's press)
      description: 'A verified result closes the item (`uploaded`, or `tracking_on_etsy` when the receipt

        had the code already); a refused or failed upload leaves it with the person who copies

        it by hand (AC-6.10.3).'
      operationId: upload_relay_item
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: A key for this press; a retry with the same key and body returns the first response
          (24 hours) and presses nothing.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWriteRunView'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          content:
