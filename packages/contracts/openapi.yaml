  /v1/shops/etsy/connect:
    post:
      tags:
      - etsy
      summary: Start connecting an Etsy shop
      description: 'Answers Etsy''s authorization URL (PKCE S256, a single-use state bound to this

        session for ten minutes). Requested scopes: shops_r, transactions_r, listings_r.'
      operationId: connect_etsy_shop
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationView'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          description: Not signed in, or the access token was rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          description: Not the Owner, no second factor, no recent step-up (forbidden, mfa-required, step-up-required,
            web-session-required), or the request did not come from the web app (csrf-failed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: Sign-in, the database or the Etsy connection is unavailable (etsy-unavailable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /v1/integrations/etsy/callback:
    post:
      tags:
      - etsy
      summary: Finish connecting an Etsy shop
      description: 'Exchanges the code, stores the tokens sealed, creates or updates the shop (one per

        Etsy shop and organization), grants the connecting Owner, and audits the connection.'
      operationId: complete_etsy_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtsyCallback'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedShopView'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          description: Not signed in, or the access token was rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          description: Not the Owner with a second factor (forbidden, mfa-required), not a web session
            (web-session-required), or not from the web app (csrf-failed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: Sign-in, the database or the Etsy connection is unavailable (etsy-unavailable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          description: The state is missing, unknown, used, expired or from another session (etsy-state-rejected),
            Etsy refused the code (etsy-authorization-refused), or the body is not valid JSON
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '409':
          description: The Etsy account has no shop (etsy-no-shop), or the shop is connected to another
            organization (etsy-shop-connected-elsewhere)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '422':
          description: Missing or oversized code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '502':
          description: Etsy did not answer usefully; nothing was saved (etsy-unreachable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
      security:
      - HTTPBearer: []
