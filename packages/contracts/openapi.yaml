openapi: 3.1.0
info:
  title: HTCO API
  summary: Backend API of HTCO OS.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: The process is alive
      description: 'Liveness: answers without touching any dependency.'
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /readyz:
    get:
      tags:
      - health
      summary: Every dependency is ready
      description: 'Readiness: runs every dependency check with a timeout.'
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: A dependency is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotReadyProblem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /v1/me:
    get:
      tags:
      - identity
      summary: The signed-in user and their organizations
      description: Who the caller is, how strongly they signed in, and their role in each organization.
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          description: Not signed in, or the access token was rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          description: Signed in, but not a member of any organization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: Sign-in or the database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
      security:
      - HTTPBearer: []
  /v1/shops:
    get:
      tags:
      - identity
      summary: The shops the caller may see
      description: Ordered by creation; Owner and Admin see every shop, other roles their granted shops.
      operationId: shops
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
      - name: shop_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Shop Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopList'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error. Quote the request ID when reporting it
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not signed in, or the access token was rejected
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Signed in, but not a member of any organization
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Sign-in or the database is unavailable
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller belongs to several organizations and named none
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The named shop or organization does not exist for the caller
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
          description: Invalid filter, limit or cursor
          headers:
            X-Request-Id:
