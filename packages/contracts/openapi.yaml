  /v1/auth/sign-in:
    post:
      tags:
      - auth
      summary: Sign in to the web app
      description: Checks the password with Supabase Auth and starts a server-side session.
      operationId: sign_in_web
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
