components:
  schemas:
    AcceptInvitationRequest:
      properties:
        access_token:
          type: string
          maxLength: 8192
          minLength: 1
          title: Access Token
        refresh_token:
          type: string
          maxLength: 1024
          minLength: 1
          title: Refresh Token
        password:
          type: string
          maxLength: 128
          minLength: 12
          title: Password
      type: object
      required:
      - access_token
      - refresh_token
      - password
      title: AcceptInvitationRequest
    AssuranceView:
      properties:
        assurance:
          type: string
          title: Assurance
      type: object
      required:
      - assurance
      title: AssuranceView
    AuthorizationView:
      properties:
        authorization_url:
          type: string
          title: Authorization Url
      type: object
      required:
      - authorization_url
      title: AuthorizationView
    CheckStatus:
      type: string
      enum:
      - ok
      - failed
      title: CheckStatus
    ConnectedShopView:
      properties:
        shop:
          $ref: '#/components/schemas/ShopView'
        integration:
          $ref: '#/components/schemas/IntegrationView'
        reconnected:
          type: boolean
          title: Reconnected
      type: object
      required:
      - shop
      - integration
      - reconnected
      title: ConnectedShopView
    EnrollRequest:
      properties:
        name:
          type: string
          maxLength: 60
          minLength: 1
          title: Name
          default: Authenticator app
      type: object
      title: EnrollRequest
    EnrollmentView:
      properties:
        factor_id:
          type: string
          title: Factor Id
        qr_code:
          type: string
          title: Qr Code
        secret:
          type: string
          title: Secret
        uri:
          type: string
          title: Uri
      type: object
      required:
      - factor_id
      - qr_code
      - secret
      - uri
      title: EnrollmentView
    EtsyCallback:
      properties:
        code:
          type: string
          maxLength: 2048
          minLength: 1
          title: Code
        state:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: State
      type: object
      required:
      - code
      title: EtsyCallback
    FactorView:
      properties:
        id:
          type: string
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        verified:
          type: boolean
          title: Verified
      type: object
      required:
      - id
      - name
      - verified
      title: FactorView
    FieldError:
      properties:
        location:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        message:
          type: string
          title: Message
      type: object
      required:
      - location
      - message
      title: FieldError
      description: 'One invalid request field: where it is and what is wrong. The input is never echoed.'
    ForgotPasswordRequest:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
      type: object
      required:
      - email
      title: ForgotPasswordRequest
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    IntegrationList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/IntegrationView'
          type: array
          title: Items
      type: object
      required:
      - items
      title: IntegrationList
    IntegrationProvider:
      type: string
      enum:
      - etsy
      title: IntegrationProvider
    IntegrationStatus:
      type: string
      enum:
      - connected
      - needs_reauth
      - disconnected
      title: IntegrationStatus
    IntegrationView:
      properties:
        shop_id:
          type: string
          format: uuid
          title: Shop Id
        provider:
          $ref: '#/components/schemas/IntegrationProvider'
        status:
          $ref: '#/components/schemas/IntegrationStatus'
        etsy_shop_id:
          type: integer
          title: Etsy Shop Id
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        token_health:
          $ref: '#/components/schemas/TokenHealth'
        access_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Access Expires At
        refresh_expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Refresh Expires At
        failure_count:
          type: integer
          title: Failure Count
        last_successful_call_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Successful Call At
        connected_at:
          type: string
          format: date-time
          title: Connected At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - shop_id
      - provider
      - status
      - etsy_shop_id
      - scopes
      - token_health
      - access_expires_at
      - refresh_expires_at
      - failure_count
      - last_successful_call_at
      - connected_at
      - updated_at
      title: IntegrationView
    Invitation:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - email
      - role
      title: Invitation
    InvitationView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        role:
          $ref: '#/components/schemas/Role'
        shop_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Shop Ids
        invite_link:
          anyOf:
          - type: string
          - type: 'null'
          title: Invite Link
      type: object
      required:
      - id
      - user_id
      - display_name
      - role
      - shop_ids
      - invite_link
      title: InvitationView
    Me:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        assurance:
          type: string
          enum:
          - aal1
          - aal2
          title: Assurance
        memberships:
          items:
            $ref: '#/components/schemas/MembershipView'
          type: array
          title: Memberships
      type: object
      required:
      - user_id
      - assurance
      - memberships
      title: Me
    MemberList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemberView'
          type: array
          title: Items
      type: object
      required:
      - items
      title: MemberList
    MemberView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        role:
          $ref: '#/components/schemas/Role'
        shop_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Shop Ids
      type: object
      required:
      - id
      - user_id
      - display_name
      - role
