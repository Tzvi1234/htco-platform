openapi: 3.1.0
info:
  title: HTCO API
  summary: Backend API of HTCO OS.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: The process is alive
      description: 'Liveness: answers without touching any dependency.'
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /readyz:
    get:
      tags:
      - health
      summary: Every dependency is ready
      description: 'Readiness: runs every dependency check with a timeout.'
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: A dependency is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotReadyProblem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /v1/me:
    get:
      tags:
      - identity
      summary: The signed-in user and their organizations
      description: Who the caller is, how strongly they signed in, and their role in each organization.
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          description: Not signed in, or the access token was rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          description: Signed in, but not a member of any organization
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: Sign-in or the database is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
      security:
      - HTTPBearer: []
  /v1/shops:
    get:
      tags:
      - identity
      summary: The shops the caller may see
      description: Ordered by creation; Owner and Admin see every shop, other roles their granted shops.
      operationId: shops
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
      - name: shop_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Shop Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopList'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error. Quote the request ID when reporting it
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not signed in, or the access token was rejected
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Signed in, but not a member of any organization
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Sign-in or the database is unavailable
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller belongs to several organizations and named none
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The named shop or organization does not exist for the caller
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
          description: Invalid filter, limit or cursor
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
components:
  schemas:
    CheckStatus:
      type: string
      enum:
      - ok
      - failed
      title: CheckStatus
    FieldError:
      properties:
        location:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        message:
          type: string
          title: Message
      type: object
      required:
      - location
      - message
      title: FieldError
      description: 'One invalid request field: where it is and what is wrong. The input is never echoed.'
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    Me:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        assurance:
          type: string
          enum:
          - aal1
          - aal2
          title: Assurance
        memberships:
          items:
            $ref: '#/components/schemas/MembershipView'
          type: array
          title: Memberships
      type: object
      required:
      - user_id
      - assurance
      - memberships
      title: Me
    MembershipView:
      properties:
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - organization_id
      - role
      title: MembershipView
    NotReadyProblem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      - checks
      title: NotReadyProblem
    Problem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      title: Problem
      description: Problem details (RFC 9457) plus the request ID.
    ReadinessStatus:
      properties:
        status:
          type: string
          const: ready
          title: Status
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadinessStatus
    Role:
      type: string
      enum:
      - owner
      - admin
      - operations
      - finance
      - support
      - developer
      - viewer
      title: Role
      description: Organization roles (FR-IAM-02). Owner and Admin act on every shop of the organization.
    ShopList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShopView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: ShopList
    ShopView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        name:
          type: string
          title: Name
        marketplace:
          type: string
          title: Marketplace
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - organization_id
      - name
      - marketplace
      - status
      title: ShopView
    ValidationProblem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
          title: Errors
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      - errors
      title: ValidationProblem
  securitySchemes:
    HTTPBearer:
      type: http
      description: Supabase access token
      scheme: bearer
      bearerFormat: JWT
