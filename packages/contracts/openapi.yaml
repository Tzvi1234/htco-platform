openapi: 3.1.0
info:
  title: HTCO API
  summary: Backend API of HTCO OS.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: The process is alive
      description: 'Liveness: answers without touching any dependency.'
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /readyz:
    get:
      tags:
      - health
      summary: Every dependency is ready
      description: 'Readiness: runs every dependency check with a timeout.'
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: A dependency is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotReadyProblem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /v1/me:
    get:
      tags:
      - identity
      summary: The signed-in user and their organizations
      description: Who the caller is, how strongly they signed in, and their role in each organization.
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
