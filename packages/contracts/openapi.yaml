openapi: 3.1.0
info:
  title: HTCO API
  summary: Backend API of HTCO OS.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: The process is alive
      description: 'Liveness: answers without touching any dependency.'
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
  /readyz:
    get:
      tags:
      - health
      summary: Every dependency is ready
      description: 'Readiness: runs every dependency check with a timeout.'
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          description: Unexpected error. Quote the request ID when reporting it
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          description: A dependency is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotReadyProblem'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
components:
  schemas:
    CheckStatus:
      type: string
      enum:
      - ok
      - failed
      title: CheckStatus
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    NotReadyProblem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      - checks
      title: NotReadyProblem
    Problem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      title: Problem
      description: Problem details (RFC 9457) plus the request ID.
    ReadinessStatus:
      properties:
        status:
          type: string
          const: ready
          title: Status
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadinessStatus
