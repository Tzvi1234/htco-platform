          description: Unexpected error. Quote the request ID when reporting it
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not signed in, or the access token was rejected
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only the Owner and Admins see connections (forbidden)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Sign-in or the database is unavailable
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The caller belongs to several organizations and named none
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The named organization does not exist for the caller
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
          description: Invalid organization ID
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
