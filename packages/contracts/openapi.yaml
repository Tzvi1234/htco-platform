components:
  schemas:
    CheckStatus:
      type: string
      enum:
      - ok
      - failed
      title: CheckStatus
    FieldError:
      properties:
        location:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        message:
          type: string
          title: Message
      type: object
      required:
      - location
      - message
      title: FieldError
      description: 'One invalid request field: where it is and what is wrong. The input is never echoed.'
    HealthStatus:
      properties:
        status:
          type: string
          const: ok
          title: Status
      type: object
      required:
      - status
      title: HealthStatus
    Invitation:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - email
      - role
      title: Invitation
    Me:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        assurance:
          type: string
          enum:
          - aal1
          - aal2
          title: Assurance
        memberships:
          items:
            $ref: '#/components/schemas/MembershipView'
          type: array
          title: Memberships
      type: object
      required:
      - user_id
      - assurance
      - memberships
      title: Me
    MemberList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemberView'
          type: array
          title: Items
      type: object
      required:
      - items
      title: MemberList
    MemberView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        role:
          $ref: '#/components/schemas/Role'
        shop_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Shop Ids
      type: object
      required:
      - id
      - user_id
      - display_name
      - role
      - shop_ids
      title: MemberView
    MembershipView:
      properties:
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - organization_id
      - role
      title: MembershipView
    NotReadyProblem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      - checks
      title: NotReadyProblem
    Problem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      title: Problem
      description: Problem details (RFC 9457) plus the request ID.
    ReadinessStatus:
      properties:
        status:
          type: string
          const: ready
          title: Status
        checks:
          additionalProperties:
            $ref: '#/components/schemas/CheckStatus'
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadinessStatus
    Role:
      type: string
      enum:
      - owner
      - admin
      - operations
      - finance
      - support
      - developer
      - viewer
      title: Role
      description: Organization roles (FR-IAM-02). Owner and Admin act on every shop of the organization.
    RoleChange:
      properties:
        role:
          $ref: '#/components/schemas/Role'
      type: object
      required:
      - role
      title: RoleChange
    SessionView:
      properties:
        user_id:
          type: string
          title: User Id
        assurance:
          type: string
          title: Assurance
      type: object
      required:
      - user_id
      - assurance
      title: SessionView
    ShopList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShopView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: ShopList
    ShopView:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        name:
          type: string
          title: Name
        marketplace:
          type: string
          title: Marketplace
        status:
          type: string
          title: Status
      type: object
      required:
      - id
      - organization_id
      - name
      - marketplace
      - status
      title: ShopView
    SignInRequest:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: SignInRequest
    ValidationProblem:
      properties:
        type:
          type: string
          title: Type
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
          title: Errors
      type: object
      required:
      - type
      - title
      - status
      - detail
      - request_id
      - errors
      title: ValidationProblem
  securitySchemes:
    HTTPBearer:
      type: http
      description: Supabase access token
      scheme: bearer
      bearerFormat: JWT
