          description: Unexpected error. Quote the request ID when reporting it
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not signed in, or the access token was rejected
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not the Owner (forbidden), no second factor (mfa-required), no recent step-up (step-up-required),
            the write switched off (write-flag-off), the kill switch on (writes-halted), or the grant
            lacks the scope (scope-missing, with `reconnect_url`)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The relay or the write actions are not set up (relay-unavailable, owner-writes-unavailable)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No Idempotency-Key, or an invalid one (idempotency-key-required, idempotency-key-invalid),
            or several organizations and none named
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '404':
