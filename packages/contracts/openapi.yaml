  /v1/relay-items/{item_id}/tracking:
    post:
      tags:
      - incidents
      summary: Paste the tracking number from AutoVA for one relay item
      description: 'An Owner or Admin with a second factor (6.10 PR B). Validated before anything else

        (AC-6.10.4); a number the Etsy receipt already carries closes the item on that evidence

        (AC-6.10.2); otherwise the item is handed off for the copy into Etsy (AC-6.10.3). Once

        per Idempotency-Key (audit 6.1): a timed-out retry gets the first answer; a second paste

        with a new key is a 409. Audited, never with the number; no Etsy call. Only the carrier

        and the last four characters are kept for the replay, never the number.'
      operationId: paste_tracking
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: 'A key for this request; a retry with the same key and body returns the first response
          (24 hours). Send it: it becomes required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingPaste'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPasteView'
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected error. Quote the request ID when reporting it
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not signed in, or the access token was rejected
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not an Owner or Admin (forbidden), or no second factor (mfa-required)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The relay is not set up on this server (relay-unavailable), or replays are not
            set up (not-ready)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: An invalid Idempotency-Key, or several organizations and none named
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: An unknown carrier or a number in the wrong format (tracking-invalid), or the Idempotency-Key
            was used with another request (idempotency-key-reused)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such relay item for the caller
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Pasted already or closed (relay-item-moved), the number is used for another order
            (tracking-already-used), or the first request with this Idempotency-Key still runs (idempotency-in-progress)
          headers:
            X-Request-Id:
              description: ID of this request, generated by the server. Quote it when reporting a problem.
              required: true
              schema:
                type: string
                format: uuid
