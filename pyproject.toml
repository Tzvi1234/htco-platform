# HTCO platform: uv workspace root. The root is virtual (not a package); each deployable
# and library lives in packages/* or apps/*. Tool settings for the whole workspace live here.

[tool.uv]
# 0.13.4 drops the compromised emSign root CA (GHSA-hq85-5cpj-mr62, critical).
required-version = ">=0.13.4,<0.14"
# Minimum release age for every dependency (ER-SEC-09): new versions are adopted only after a week.
exclude-newer = "7 days"
# Exceptions for security fixes newer than a week, each with its advisory; remove once a week old.
# certifi 2026.10.19 fixes PYSEC-2026-4320 / GHSA-6q48-6c7w-9gw2 (critical), released 2026-10-19.
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z" }

[tool.uv.workspace]
members = ["packages/*", "apps/*", "workers/*"]
# Contracts are language-neutral files (OpenAPI, event schemas), not a Python package.
exclude = ["packages/contracts"]

[dependency-groups]
dev = [
  "anyio>=4.12,<5",
  "coverage>=7.10,<8",
  "httpx>=0.28,<0.29",
  "hypothesis>=6.140,<7",
  "import-linter>=2.15,<3",
  "mypy>=2.4,<3",
  "prek>=0.5,<0.6",
  "pytest>=9.1,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.16,<0.18",
  "rust-just>=1.58,<2",
  "schemathesis>=4.20,<5",
  "types-pyyaml>=6.0,<7",
]
# Workflow linters, installed only when used: `uv run --group ci …` (`just workflows`).
ci = [
  "actionlint-py>=1.7,<2",
  "zizmor>=1.30,<2",
]

# --- Ruff ------------------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["supabase"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "ASYNC", "FAST", "TID", "ARG",
  "DTZ", "T20", "ERA", "PL", "PERF", "FURB", "N", "TRY", "LOG", "G", "RET", "PTH",
]
ignore = [
  "TRY003", # Exception messages are written where the error is raised; a subclass per message adds nothing.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # pytest uses assert.
  "PLR2004", # Literal expected values are the point of a test.
  "S603",    # Tests start trusted subprocesses (our own entry points) on purpose.
]

[tool.ruff.lint.isort]
known-first-party = ["htco_*", "tests", "tools"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

# --- mypy ------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "possibly-undefined",
  "unused-awaitable",
  "explicit-override",
]
files = ["packages", "apps", "workers", "tests", "tools"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest and coverage ---------------------------------------------------------------------

[tool.pytest]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
# Third-party pytest plugins load only when listed here (dependencies such as langsmith ship one).
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--disable-plugin-autoload",
  "-p", "anyio",
  "-p", "hypothesispytest",
  "-p", "schemathesis",
  # Tests that need a database run with `just test-db` (CI: the `database` job).
  "-m", "not db",
]
strict = true
filterwarnings = [
  "error",
  # langsmith, pulled in by langchain-core, calls an asyncio API deprecated in Python 3.14.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
markers = [
  "ac(id): the acceptance criterion (for example AC-1.2.3) that this test proves",
  "db: needs a running database (HTCO_TEST_DATABASE_URL); run with `just test-db`",
  "browser: needs Chromium (HTCO_TEST_BROWSER=1); runs against 127.0.0.1 pages only",
]

[tool.coverage.run]
branch = true
source_pkgs = [
  "htco_domain", "htco_application", "htco_platform", "htco_agent_runtime", "htco_persistence",
  "htco_integrations", "htco_api", "htco_worker", "htco_browser_worker",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

# --- Architecture contracts (ER-ARCH-01, SOFTWARE_DESIGN §4.3) --------------------------------
# "Domain and application import only the standard library and inner layers" is checked by
# tests/architecture/test_layer_purity.py, because import-linter cannot express an allow-list.

[tool.importlinter]
root_packages = [
  "htco_domain", "htco_application", "htco_platform", "htco_agent_runtime", "htco_persistence",
  "htco_integrations", "htco_api", "htco_worker", "htco_browser_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "dependency-rule"
name = "Dependency rule: composition roots -> adapters -> application -> domain"
type = "layers"
# Adapters (agent runtime, persistence, integrations) sit side by side and never import each other.
# The API and the worker are composition roots side by side; neither imports the other.
layers = [
  "htco_api | htco_worker | htco_browser_worker",
  "htco_agent_runtime | htco_persistence | htco_integrations",
  "htco_application",
  "htco_domain",
]

[[tool.importlinter.contracts]]
id = "platform-is-infrastructure"
name = "Platform holds infrastructure only: no business, adapter or web framework code"
type = "forbidden"
source_modules = ["htco_platform"]
forbidden_modules = [
  "htco_domain", "htco_application", "htco_agent_runtime", "htco_persistence", "htco_api",
  "htco_worker", "fastapi", "starlette", "uvicorn",
]

[[tool.importlinter.contracts]]
id = "inner-layers-without-platform"
name = "Domain and application do not depend on platform infrastructure"
type = "forbidden"
source_modules = ["htco_domain", "htco_application"]
forbidden_modules = ["htco_platform"]

[[tool.importlinter.contracts]]
id = "langgraph-only-in-agent-runtime"
name = "Only the agent runtime imports LangGraph"
type = "forbidden"
source_modules = [
  "htco_domain", "htco_application", "htco_platform", "htco_integrations", "htco_api",
  "htco_worker",
]
forbidden_modules = ["langgraph", "langchain_core"]

[[tool.importlinter.contracts]]
id = "order-automations-deterministic"
name = "The three order automations make no model, agent or browser call (AC-5.11.7)"
type = "forbidden"
source_modules = [
  "htco_application.order_intake", "htco_application.order_automations",
  "htco_application.order_ingest", "htco_persistence.order_automations",
]
forbidden_modules = ["htco_agent_runtime", "langgraph", "langchain_core"]

[[tool.importlinter.contracts]]
id = "playwright-only-in-browser-worker"
name = "Only the browser worker imports Playwright (ADR-0020 §8)"
type = "forbidden"
source_modules = [
  "htco_domain", "htco_application", "htco_platform", "htco_agent_runtime", "htco_persistence",
  "htco_integrations", "htco_api", "htco_worker",
]
forbidden_modules = ["playwright"]

[[tool.importlinter.contracts]]
id = "browser-worker-holds-no-etsy-tokens"
name = "The browser worker never reaches Etsy OAuth tokens or the Etsy adapters (ADR-0020 §8)"
type = "forbidden"
source_modules = ["htco_browser_worker"]
forbidden_modules = [
  "htco_integrations", "htco_persistence.shop_integrations", "htco_application.etsy_tokens",
  "htco_application.etsy_connect", "htco_api", "htco_worker", "httpx",
]

[[tool.importlinter.contracts]]
id = "database-driver-only-in-persistence"
name = "Only persistence imports the database driver (ADR-0011)"
type = "forbidden"
source_modules = [
  "htco_domain", "htco_application", "htco_platform", "htco_agent_runtime", "htco_integrations",
  "htco_api", "htco_worker",
]
forbidden_modules = ["psycopg", "psycopg_pool"]
# Composition roots reach the driver through persistence adapters; only direct imports are banned.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "http-client-only-in-adapters"
name = "Only integrations, platform and the composition roots import the HTTP client"
type = "forbidden"
source_modules = ["htco_domain", "htco_application", "htco_persistence", "htco_agent_runtime"]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
id = "web-framework-only-in-api"
name = "Only the API imports the web framework"
type = "forbidden"
source_modules = [
  "htco_domain", "htco_application", "htco_persistence", "htco_integrations",
  "htco_agent_runtime", "htco_worker",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
id = "no-pydantic-in-adapters"
name = "Persistence, integrations and the agent runtime map to dataclasses, not pydantic"
type = "forbidden"
source_modules = ["htco_persistence", "htco_integrations", "htco_agent_runtime"]
forbidden_modules = ["pydantic", "pydantic_settings"]

[[tool.importlinter.contracts]]
id = "api-routers-use-application-only"
name = "API modules reach adapters only through the main and cli composition roots"
type = "forbidden"
# The whole package, so a new router is covered without being listed; only the two
# composition roots may wire adapters.
source_modules = ["htco_api"]
forbidden_modules = ["htco_persistence", "htco_integrations", "psycopg", "httpx"]
ignore_imports = [
  "htco_api.main -> htco_persistence.**", "htco_api.main -> htco_integrations.**",
  "htco_api.main -> httpx", "htco_api.cli -> htco_persistence.**",
]
# Unmatched ignores fail the run, so widen this list only when cli.py or main.py needs it.
allow_indirect_imports = true
